name: Code Coverage

on:
  push:
    branches:
      - main
      - ci-test
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/coverage.yml'
      - 'cmake/coverage.cmake'
  pull_request:
    branches:
      - main
      - ci-test
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/coverage.yml'
      - 'cmake/coverage.cmake'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage (ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: Load cached dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps/build/destdir
          key: ${{ runner.os }}-cache-orcaslicer_deps-coverage-${{ hashFiles('deps/**') }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git g++ build-essential libgl1-mesa-dev m4 \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules pkgconf \
            libglu1-mesa-dev libcairo2-dev libgtk-3-dev libsoup2.4-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-good1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad wget sudo autoconf curl libunwind-dev texinfo ccache lcov

      - name: Install dependencies from build_linux.sh
        shell: bash
        run: sudo ./build_linux.sh -ur

      - name: Fix permissions
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build dependencies (if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p deps/build
          mkdir -p deps/build/destdir
          ./build_linux.sh -dr


      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-coverage
      - name: Configure CMake with coverage
        shell: bash
        run: cmake -S . -B build_cov -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/deps/build/destdir/usr/local" -DOPENVDB_USE_STATIC_LIBS=ON

      - name: Build tests
        shell: bash
        run: cmake --build build_cov --target tests --parallel

      - name: Run tests with JUnit output
        shell: bash
        run: ctest --test-dir build_cov --output-on-failure --output-junit build_cov/test-results.xml

      - name: Generate coverage report
        shell: bash
        run: |
          cmake --build build_cov --target coverage 2>&1 | tee build_cov/coverage-summary.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-coverage
          path: build_cov/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: build_cov/coverage/

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-summary
          path: build_cov/coverage-summary.txt
