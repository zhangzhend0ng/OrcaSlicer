name: Sanitizer Tests (ASan + UBSan)

on:
  push:
    branches:
      - main
      - ci-test
      - release/*
    paths:
      - "src/**"
      - "tests/**"
      - "**/CMakeLists.txt"
      - ".github/workflows/sanitizer-tests.yml"
      - "cmake/sanitizers.cmake"
  pull_request:
    branches:
      - main
      - ci-test
      - release/*
    paths:
      - "src/**"
      - "tests/**"
      - "**/CMakeLists.txt"
      - ".github/workflows/sanitizer-tests.yml"
      - "cmake/sanitizers.cmake"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ASan+UBSan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:halt_on_error=1
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: "true"

      - name: Load cached dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps/build/destdir
          key: ${{ matrix.os }}-cache-orcaslicer_deps-sanitizer-${{ hashFiles('deps/CMakeLists.txt', 'deps/*.cmake', 'deps/*/*.cmake', 'deps/*/*.patch') }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Setup swap (sanitizer builds need extra memory)
        shell: bash
        run: |
          SWAPFILE="/swapfile-$$"
          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 4G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          # Clean up stale swap from previous runs on reused runners
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git g++ build-essential libgl1-mesa-dev m4 \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules pkgconf \
            libglu1-mesa-dev libcairo2-dev libgtk-3-dev libsoup2.4-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-good1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad wget sudo autoconf curl libunwind-dev texinfo llvm ccache libblosc-dev

      - name: Install dependencies from build_linux.sh
        shell: bash
        run: sudo ./build_linux.sh -ur

      - name: Fix permissions
        shell: bash
        run: sudo chown $USER -R ./

      - name: Free disk space
        shell: bash
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          echo "After cleanup:" && df -h /

      - name: Build dependencies (if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p deps/build
          mkdir -p deps/build/destdir
          ./build_linux.sh -dr

      - name: Fix permissions (post-build)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-sanitizers
          append-timestamp: false
          restore-keys: |
            ${{ matrix.os }}-release

      - name: Configure CMake with ASan+UBSan
        shell: bash
        run: cmake -S . -B build_san -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/deps/build/destdir/usr/local" -DSLIC3R_STATIC=ON -DOPENVDB_USE_STATIC_LIBS=ON -DSLIC3R_GUI=OFF -DBUILD_TESTS=ON

      - name: Build tests
        id: build-tests
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/build/destdir/usr/local/lib:$LD_LIBRARY_PATH
        run: |
          cmake --build build_san --target tests --parallel 1
          test -f build_san/tests/libslic3r_tests \
            || test -f build_san/tests/slic3rutils_tests \
            || test -f build_san/tests/libnest2d_tests \
            || { echo "ERROR: No test binaries found in build_san/tests/"; exit 1; }

      - name: Detect changed modules
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files_yaml: |
            core:
              - src/libslic3r/**
            gui:
              - src/slic3r/**
            cmake:
              - "**/CMakeLists.txt"
              - cmake/**
            test_infra:
              - tests/*.hpp
              - tests/*.cpp
              - tests/data/**
            test_libslic3r:
              - tests/libslic3r/**
            test_fff_print:
              - tests/fff_print/**
            test_sla_print:
              - tests/sla_print/**
            test_slic3rutils:
              - tests/slic3rutils/**
            test_libnest2d:
              - tests/libnest2d/**
            ci_config:
              - .github/workflows/**

      - name: Determine test filter
        id: filter
        shell: bash
        run: |
          if [ "${{ steps.changed.outputs.core_any_changed }}" = "true" ] || \
             [ "${{ steps.changed.outputs.cmake_any_changed }}" = "true" ] || \
             [ "${{ steps.changed.outputs.test_infra_any_changed }}" = "true" ] || \
             [ "${{ steps.changed.outputs.ci_config_any_changed }}" = "true" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.gui_any_changed }}" = "true" ]; then
            echo "filter=slic3rutils" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_libslic3r_any_changed }}" = "true" ]; then
            echo "filter=libslic3r" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_fff_print_any_changed }}" = "true" ]; then
            echo "filter=fff_print" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_sla_print_any_changed }}" = "true" ]; then
            echo "filter=sla_print" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_slic3rutils_any_changed }}" = "true" ]; then
            echo "filter=slic3rutils" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_libnest2d_any_changed }}" = "true" ]; then
            echo "filter=libnest2d" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "filter=__SKIP__" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: success() && steps.filter.outputs.filter != '__SKIP__'
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/build/destdir/usr/local/lib:$LD_LIBRARY_PATH
        run: |
          if [ -n "${{ steps.filter.outputs.filter }}" ]; then
            ctest --test-dir build_san --output-on-failure --output-junit build_san/test-results.xml --timeout 3600 -R "${{ steps.filter.outputs.filter }}"
          else
            ctest --test-dir build_san --output-on-failure --output-junit build_san/test-results.xml --timeout 3600
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-sanitizer-${{ matrix.os }}
          path: build_san/test-results.xml
          if-no-files-found: warn
