name: Sanitizer Tests (ASan + UBSan)

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/sanitizer-tests.yml'
      - 'cmake/sanitizers.cmake'
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/sanitizer-tests.yml'
      - 'cmake/sanitizers.cmake'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── ASan (AddressSanitizer) ─────────────────────────────────────────────
  asan:
    name: ASan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:halt_on_error=1
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: Load cached dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps/build/destdir
          key: ${{ matrix.os }}-cache-orcaslicer_deps-sanitizer-${{ hashFiles('deps/**') }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git g++ build-essential libgl1-mesa-dev m4 \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules pkgconf \
            libglu1-mesa-dev libcairo2-dev libgtk-3-dev libsoup2.4-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-good1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad wget sudo autoconf curl libunwind-dev texinfo llvm-18 ccache

      - name: Install dependencies from build_linux.sh
        shell: bash
        run: sudo ./build_linux.sh -ur

      - name: Fix permissions
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build dependencies (if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p deps/build
          mkdir -p deps/build/destdir
          ./build_linux.sh -dr

      - name: Setup ccache (ASan)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-asan

      - name: Configure CMake with ASan
        shell: bash
        run: cmake -S . -B build_asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON

      - name: Build tests with ASan
        shell: bash
        run: cmake --build build_asan --target tests --parallel

      - name: Run tests with ASan
        shell: bash
        run: ctest --test-dir build_asan --output-on-failure --timeout 300

  # ── UBSan (UndefinedBehaviorSanitizer) ──────────────────────────────────
  ubsan:
    name: UBSan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: Load cached dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps/build/destdir
          key: ${{ matrix.os }}-cache-orcaslicer_deps-sanitizer-${{ hashFiles('deps/**') }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git g++ build-essential libgl1-mesa-dev m4 \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules pkgconf \
            libglu1-mesa-dev libcairo2-dev libgtk-3-dev libsoup2.4-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-good1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad wget sudo autoconf curl libunwind-dev texinfo llvm-18 ccache

      - name: Install dependencies from build_linux.sh
        shell: bash
        run: sudo ./build_linux.sh -ur

      - name: Fix permissions
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build dependencies (if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p deps/build
          mkdir -p deps/build/destdir
          ./build_linux.sh -dr

      - name: Setup ccache (UBSan)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-ubsan

      - name: Configure CMake with UBSan
        shell: bash
        run: cmake -S . -B build_ubsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_UBSAN=ON

      - name: Build tests with UBSan
        shell: bash
        run: cmake --build build_ubsan --target tests --parallel

      - name: Run tests with UBSan
        shell: bash
        run: ctest --test-dir build_ubsan --output-on-failure --timeout 300
